<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Management</title>
  </head>
  <body>
    <div id="root">
      <div id="app-loading" style="display:flex;height:100vh;width:100%;align-items:center;justify-content:center;background:#fff">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.8s linear infinite">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
      </div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #app-loading { background: #0f172a !important; }
        #app-loading svg { stroke: #f8fafc !important; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
