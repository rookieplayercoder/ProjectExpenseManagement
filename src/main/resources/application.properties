# JWT
# jwt.secret must be at least 32 characters (HS256 requires a >= 256-bit key).
# Override via env var in real deployments - do not commit a real secret.
jwt.secret=${JWT_SECRET:change-this-dev-only-secret-key-please}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}