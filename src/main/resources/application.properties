spring.application.name=ProjectExpenseManagement

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_management}
spring.datasource.username=postgres
spring.datasource.password=FUck$4598
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JWT
# jwt.secret must be at least 32 characters (HS256 requires a >= 256-bit key).
# Override via env var in real deployments - do not commit a real secret.
jwt.secret=${JWT_SECRET:change-this-dev-only-secret-key-please}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Rate limiting - applies only to POST /api/v1/auth/login and POST /api/v1/users
# (the two endpoints reachable without a JWT). In-memory and per-instance; see
# RateLimitingFilter for the multi-instance-deployment caveat.
rate-limit.login.max-requests=${RATE_LIMIT_LOGIN_MAX:10}
rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
rate-limit.register.max-requests=${RATE_LIMIT_REGISTER_MAX:5}
rate-limit.register.window-seconds=${RATE_LIMIT_REGISTER_WINDOW_SECONDS:60}

# Actuator - only /actuator/health is exposed (used by the Docker healthcheck
# and, if you deploy behind an orchestrator, its readiness/liveness probes).
# show-details defaults to "never" so DB connection details/errors aren't
# exposed to an unauthenticated caller.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true